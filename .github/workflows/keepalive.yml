name: Keep Alive Render Service

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute idle timeout
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: curl -s -f https://evchargerloc.onrender.com/healthz || echo "Ping failed, but keeping action alive"
